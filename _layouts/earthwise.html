<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.name }}{% if page.url != '/' %} | {{ site.name }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/earthwise.css">
{% if page.layout == 'article' %}<link rel="stylesheet" href="/assets/css/earthwise-article.css">{% endif %}
<script>document.documentElement.className+=' js';</script>
</head>
<body class="{{ page.body_class }}">
{% include ew-header.html %}
<main id="main">{{ content }}</main>
{% include ew-footer.html %}
<script src="/assets/js/earthwise.js" defer></script>
</body>
</html>
