# =============================================================================
# Radar Mine Monitoring article: placeholder definitions + DUMMY DATA
# -----------------------------------------------------------------------------
# Single source of truth for every map, chart, image and table on
# radar-mine-monitoring/index.md. The page refers to entries by ID only.
#
# Placeholders exist ONLY for the promised outputs (F1, F3, F4, F5, F6) and
# for items derived from the same processes (F2, F7, F8, T1, T2). T3 is static.
# See _context/site-plan.md section 4.
#
# To swap a placeholder for the real thing:
#   1. put the file under assets/images/radar/  (GIFs work the same way)
#   2. set  image: assets/images/radar/<file>  on the entry
#   3. set  status: final
# All numbers below are FICTIONAL and exist only to test the layout.
# =============================================================================

concession:
  name: "Concession KN-07"            # fictional
  holder: "PT Contoh Nikel (fictional)"
  commodity: "Nickel"
  region: "Central Sulawesi"
  report_month: "October 2026"
  history_from: "2017"

# --- Figures -------------------------------------------------------------------
# type: map | chart | image | gif | diagram   ratio: CSS aspect-ratio (w/h)
# width: normal | wide                        status: placeholder | draft | final
# promise: promised | derived                 (which list in site-plan.md it comes from)
figures:
  - id: F1
    type: gif
    promise: promised
    width: wide
    ratio: "21/9"
    title: "Yearly land cover 2017–2025: radar vs optical"
    shows: "Animated side-by-side, one frame per year 2017–2025. Left: annual Sentinel-2 optical image of the concession (cloud gaps visible). Right: annual SAR-based land-cover map of the same year. Year label on each frame."
    source: "Annual SAR land cover 2017–2025 + annual Sentinel-2 composites"
    owner: "Nasir"
    status: placeholder
    caption: "Where optical is blank or blurred by cloud, the radar-based map is complete, every year since 2017."

  - id: F2
    type: chart
    promise: derived
    width: normal
    ratio: "16/9"
    title: "Clear optical images vs radar passes, per year"
    shows: "Grouped bars for 2017–2025: number of cloud-free Sentinel-2 observations vs number of Sentinel-1 passes over the concession."
    source: "Sentinel-2 cloud statistics + Sentinel-1 acquisition list (same processing)"
    owner: "Nasir"
    status: placeholder
    caption: "Optical needs a clear sky. In some years it barely gets one."

  - id: F3
    type: gif
    promise: promised
    width: wide
    ratio: "16/9"
    title: "Monthly radar results"
    shows: "Animated sequence of monthly radar-based land-cover maps of the concession, one frame per month, with month label. Shows expansion and recovery over time."
    source: "Monthly radar results"
    owner: "Nasir"
    status: placeholder
    caption: "Month by month, the mine as it actually moves. Each monthly report adds one frame."

  - id: F4
    type: chart
    promise: promised
    width: normal
    ratio: "16/9"
    title: "Mining expansion rate"
    shows: "Bars: hectares of newly opened mining ground per year, 2017–2025, with a line for the cumulative mining footprint."
    source: "Annual SAR land cover (transition to mining class)"
    owner: "Nasir"
    status: placeholder
    caption: "How many hectares were opened each year, and how the footprint added up."

  - id: F5
    type: chart
    promise: promised
    width: normal
    ratio: "16/9"
    title: "Reclamation rate"
    shows: "Bars: hectares of formerly mined ground classified as revegetating per year, 2017–2025; optional line for the share of the footprint reclaimed."
    source: "Annual SAR land cover (transition from mining to revegetation)"
    owner: "Nasir"
    status: placeholder
    caption: "How much disturbed land is actually coming back."

  - id: F6
    type: chart
    promise: promised
    width: normal
    ratio: "16/9"
    title: "Carbon loss and gain"
    shows: "Diverging bars per year 2017–2025: estimated carbon lost to clearing (below zero) and regained by revegetation (above zero), with a net line. Units: t CO2e."
    source: "Annual land-cover transitions × carbon factors"
    owner: "Nasir"
    status: placeholder
    caption: "Estimated from land cover, not measured in the field."

  - id: F7
    type: image
    promise: derived
    width: wide
    ratio: "21/9"
    title: "Raw radar vs corrected radar"
    shows: "Three panels of the same hillside: raw Sentinel-1 (speckled, slopes bright and dark from geometry), after terrain correction, after speckle filtering. The pit edge only becomes readable in the third panel."
    source: "Sentinel-1 preprocessing chain"
    owner: "Nasir"
    status: placeholder
    caption: "The data is free. Making it readable is the work."

  - id: F8
    type: image
    promise: derived
    width: normal
    ratio: "3/4"
    title: "A page from your monthly report"
    shows: "Mock-up of the PDF report's first page: headline numbers, this month's radar map, small expansion and reclamation charts."
    source: "Report template (in progress)"
    owner: "Web"
    status: placeholder
    caption: "One page to read before the meeting. The detail sits behind it."

