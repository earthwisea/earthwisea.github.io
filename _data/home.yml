nav:
  - { label: "Radar monitoring", url: "/radar-mine-monitoring/" }
  - { label: "About", url: "/about/" }
  - { label: "Contact", url: "/contact/" }
hero:
  kicker: "Satellite intelligence"
  title: "See what's changing on the ground, whatever the weather."
  sub: "Radar and machine learning that turn satellite data into clear answers about mines and land in Indonesia."
  cta_label: "Explore radar mine monitoring"
  cta_url: "/radar-mine-monitoring/"
rows:
  - title: "Beyond optical"
    button: { label: "Read more", url: "/radar-mine-monitoring/" }
    cards:
      - { title: "Clouds hide the mine", text: "Optical satellites mapped the footprint, but over Sulawesi and Maluku they lose whole seasons, sometimes whole years, to cloud.", label: "What optical could do", url: "/radar-mine-monitoring/#optical" }
      - { title: "Radar fills the gaps", text: "Radar sees through cloud, so every year since 2017 is mapped and every month from now on.", label: "What radar adds", url: "/radar-mine-monitoring/#radar" }
  - title: "A report built for decision-makers"
    button: { label: "Read more", url: "/radar-mine-monitoring/#report" }
    cards:
      - { title: "One PDF a month", text: "Mining expansion, reclamation and carbon loss and gain for your concession, in a short report written for people who decide.", label: "What's in the report", url: "/radar-mine-monitoring/#report" }
      - { title: "Compare over time", text: "Each report builds on the last, so you see change month by month and year by year, back to 2017.", label: "See the history", url: "/radar-mine-monitoring/#report" }
banner:
  kicker: "Pilot"
  title: "Start with one concession."
  text: "Share your concession boundary with us in confidence. We build its history back to 2017 and send your first monthly report."
  label: "Request a pilot"
  url: "mailto"
  subject: "Pilot: Radar mine monitoring"
